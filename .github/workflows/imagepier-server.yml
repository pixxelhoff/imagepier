name: ImagePier – build server image

on:
  push:
    branches: [imagepier]
    tags: ['v*-ip.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagepier-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'pixxelhoff/imagepier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Point build metadata to the ImagePier repository
        run: |
          sed -i -E '/^ENV IMMICH_/ {
            s#github.com/immich-app/immich/#github.com/pixxelhoff/imagepier/#g
            s#pkgs/container/immich-server#pkgs/container/imagepier-server#g
            s#IMMICH_REPOSITORY=immich-app/immich#IMMICH_REPOSITORY=pixxelhoff/imagepier#
            s#IMMICH_REPOSITORY_URL=https://github.com/immich-app/immich$#IMMICH_REPOSITORY_URL=https://github.com/pixxelhoff/imagepier#
          }' server/Dockerfile
          grep -n '^ENV IMMICH_' server/Dockerfile

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pixxelhoff/imagepier-server
          tags: |
            type=ref,event=tag
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/imagepier' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ github.ref_name }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
